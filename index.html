<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector y Reemplazador de Código</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 24px;
        }

        .section {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            background: #eef2f5;
            border: 1px dashed #b0bec5;
            border-radius: 5px;
            cursor: pointer;
        }

        .replace-controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .field-group {
            flex: 1;
            min-width: 250px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: monospace;
            font-size: 14px;
        }

        .actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #2980b9;
        }

        button.download-btn {
            background-color: #2ecc71;
        }

        button.download-btn:hover {
            background-color: #27ae60;
        }

        .counter-badge {
            font-weight: bold;
            font-size: 15px;
            padding: 8px 12px;
            background-color: #e8f8f5;
            border: 1px solid #2ecc71;
            color: #27ae60;
            border-radius: 5px;
            display: none;
        }

        textarea {
            width: 100%;
            height: 300px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #282c34;
            color: #abb2bf;
            resize: vertical;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Reemplazador de Texto / Código</h1>

    <!-- Cargar archivo -->
    <div class="section">
        <label for="fileInput">1. Selecciona un archivo:</label>
        <input type="file" id="fileInput">
    </div>

    <!-- Controles de Reemplazo -->
    <div class="section replace-controls">
        <div class="field-group">
            <label for="findText">2. Texto / Código a buscar:</label>
            <input type="text" id="findText" placeholder='Ej: Code>1.0'>
        </div>
        <div class="field-group">
            <label for="replaceText">3. Reemplazar por:</label>
            <input type="text" id="replaceText" placeholder='Ej: Code>-1.0'>
        </div>
    </div>

    <!-- Acciones -->
    <div class="section actions">
        <button id="btnReplace">Buscar y Reemplazar</button>
        <button id="btnDownload" class="download-btn" style="display:none;">Guardar Archivo</button>
        <div id="counterResult" class="counter-badge"></div>
    </div>

    <!-- Vista previa del código -->
    <div class="section">
        <label for="fileContent">Vista previa del contenido:</label>
        <textarea id="fileContent" placeholder="El contenido del archivo aparecerá aquí..." readonly></textarea>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const fileContent = document.getElementById('fileContent');
    const findText = document.getElementById('findText');
    const replaceText = document.getElementById('replaceText');
    const btnReplace = document.getElementById('btnReplace');
    const btnDownload = document.getElementById('btnDownload');
    const counterResult = document.getElementById('counterResult');

    let fileName = 'archivo_modificado.txt';

    // 1. Leer el archivo cargado
    fileInput.addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            fileName = file.name;
            const reader = new FileReader();
            reader.onload = function(e) {
                fileContent.value = e.target.result;
                fileContent.removeAttribute('readonly'); // Permite editar también manualmente
                counterResult.style.display = 'none';
                btnDownload.style.display = 'none';
            };
            reader.readAsText(file);
        }
    });

    // Función auxiliar para escapar caracteres especiales de Expresiones Regulares
    function escapeRegExp(string) {
        return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    // 2. Lógica para Buscar y Reemplazar
    btnReplace.addEventListener('click', function() {
        const textToFind = findText.value;
        const textToReplace = replaceText.value;
        const currentContent = fileContent.value;

        if (!currentContent) {
            alert('Por favor, primero carga un archivo o escribe algo en el área de texto.');
            return;
        }

        if (!textToFind) {
            alert('Por favor, ingresa el texto que deseas buscar.');
            return;
        }

        // Crear una Expresión Regular para buscar todas las coincidencias exactas
        const escapedFind = escapeRegExp(textToFind);
        const regex = new RegExp(escapedFind, 'g');

        // Contar coincidencias
        const matches = currentContent.match(regex);
        const count = matches ? matches.length : 0;

        // Reemplazar todo el texto
        const newContent = currentContent.replace(regex, textToReplace);
        fileContent.value = newContent;

        // Mostrar el contador
        counterResult.style.display = 'inline-block';
        if (count === 1) {
            counterResult.innerText = `Se reemplazó 1 coincidencia.`;
        } else {
            counterResult.innerText = `Se reemplazaron ${count} coincidencias.`;
        }

        // Mostrar botón para descargar
        btnDownload.style.display = 'inline-block';
    });

    // 3. Descargar el archivo con los cambios realizados
    btnDownload.addEventListener('click', function() {
        const blob = new Blob([fileContent.value], { type: 'text/plain;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = "modificado_" + fileName;
        link.click();
        URL.revokeObjectURL(link.href);
    });
</script>

</body>
</html>
